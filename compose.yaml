services:
  mlflow:
    build: .
    container_name: mlflowops-mlflow
    command: >
      mlflow server
      --backend-store-uri sqlite:////app/mlflow.db
      --default-artifact-root /app/mlartifacts
      --host 0.0.0.0
      --port 5000
      --allowed-hosts "*"
    ports:
      - "5050:5000"
    volumes:
      - ./:/app
      - ./:${MLFLOW_LEGACY_PATH:-/app/legacy-mlflowops}
    restart: unless-stopped

  api:
    build: .
    container_name: mlflowops-api
    command: >
      uvicorn api.main:app
      --host 0.0.0.0
      --port 8000
    ports:
      - "8000:8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      - mlflow
    volumes:
      - ./:/app
      - ./:${MLFLOW_LEGACY_PATH:-/app/legacy-mlflowops}
    restart: unless-stopped

  dashboard:
    build: .
    container_name: mlflowops-dashboard
    command: >
      streamlit run dashboard/app.py
      --server.address 0.0.0.0
      --server.port 8501
      --server.headless true
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    volumes:
      - ./:/app
      - ./:${MLFLOW_LEGACY_PATH:-/app/legacy-mlflowops}
    restart: unless-stopped
